<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1e2126">
    <title>Détails du Produit | LUX FUTURA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --dark-bg: #1e2126;
            --mid-dark-bg: #2b3038;
            --light-text: #f0f2f4;
            --secondary-text: #b0b8c2;
            --accent-primary: #00a8a8;
            --accent-secondary: #ff9900;
            --accent-hover: #008f8f;
            --success-color: #38b000;
            --radius-default: 8px;
            --radius-large: 16px;
            --font-title: 'Playfair Display', serif;
            --font-body: 'Roboto', sans-serif;
        }

        body {
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--light-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header (simplifié pour la démo, idéalement identique à index.html) */
        .site-header {
            background-color: rgba(30, 33, 38, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-header h1 {
            font-family: var(--font-title);
            font-size: 1.5rem;
            margin: 0;
            color: var(--light-text);
            text-transform: uppercase;
        }

        .back-link {
            color: var(--accent-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        /* Product Detail Section */
        .product-detail-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 20px;
        }

        .product-image-section {
            width: 100%;
        }

        .product-image-section img {
            width: 100%;
            border-radius: var(--radius-large);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: cover;
        }

        .product-info-section {
            width: 100%;
        }

        .product-title {
            font-family: var(--font-title);
            font-size: 2rem;
            margin: 0 0 15px 0;
            color: var(--light-text);
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-secondary);
            margin-bottom: 20px;
        }

        .product-description {
            color: var(--secondary-text);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 18px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn-cart {
            background-color: var(--accent-primary);
            color: white;
        }

        .btn-order {
            background-color: var(--accent-secondary);
            color: var(--dark-bg);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Formulaire de commande */
        .order-form-section {
            margin-top: 60px;
            padding: 30px;
            background-color: var(--mid-dark-bg);
            border-radius: var(--radius-large);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .order-form-section h2 {
            font-family: var(--font-title);
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary-text);
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            background-color: var(--dark-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-default);
            color: white;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn-submit {
            background-color: var(--success-color);
            color: white;
            margin-top: 10px;
        }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            .product-detail-container {
                flex-direction: row;
                align-items: flex-start;
            }

            .product-image-section {
                width: 50%;
            }

            .product-info-section {
                width: 50%;
            }

            .action-buttons {
                flex-direction: row;
            }

            .btn {
                flex: 1;
            }
        }

        /* Cart Notification */
        #cart-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--success-color);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        #cart-notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .cart-badge {
            position: relative;
            background: none;
            border: none;
            color: var(--light-text);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--accent-secondary);
            color: var(--dark-bg);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
            <h1>LUX FUTURA</h1>
            <div class="cart-badge">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-counter" class="cart-count">0</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="product-content" class="product-detail-container">
            <!-- Rempli dynamiquement par details.js -->
            <p>Chargement du produit...</p>
        </div>

        <section id="order-form" class="order-form-section">
            <h2>Finaliser votre commande</h2>
            <form id="purchase-form">
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="adresse">Adresse de livraison</label>
                    <input type="text" id="adresse" name="adresse" required>
                </div>
                <div class="form-group">
                    <label for="ville">Ville</label>
                    <input type="text" id="ville" name="ville" required>
                </div>
                <button type="submit" class="btn btn-submit">Valider la commande</button>
            </form>
        </section>
    </main>

    <div id="cart-notification">Produit ajouté !</div>

    <script src="products.js"></script>
    <script src="details.js"></script>
</body>
</html>
